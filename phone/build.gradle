plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.clean.phone'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.clean.phone'
        minSdk 24
        targetSdk 34
        // each CI build is newer than the last, so "Update" is always offered
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0'
    }

    signingConfigs {
        // The same fixed key as the launcher (committed on purpose): a new build installs over the old one with "Update".
        cyt {
            storeFile rootProject.file('cyt.keystore')
            storePassword 'cleanyourtv'
            keyAlias 'cyt'
            keyPassword 'cleanyourtv'
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded, never published: signed with the fixed key above.
            signingConfig signingConfigs.cyt
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// The launcher APK (built from :launcher, minSdk 24) travels inside this app as an asset and is pushed to the TV.
def launcherApk = tasks.register('copyLauncherApk', Copy) {
    dependsOn ':launcher:assembleRelease'
    from(project(':launcher').layout.buildDirectory.dir('outputs/apk/release')) {
        include '*.apk'
        rename { 'launcher.apk' }
    }
    into 'src/main/assets'
}
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach {
    dependsOn launcherApk
}
preBuild.dependsOn launcherApk
